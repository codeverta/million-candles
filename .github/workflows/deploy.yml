name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/html/million-candles

            # 1. FIX PERMISSION: Ubah owner folder menjadi user yang sedang login (PENTING)
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S chown -R ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} .

            # 2. Git Config Safe Directory & Pull Code
            git config --global --add safe.directory /var/www/html/million-candles
            git remote set-url origin https://${{ secrets.GH_TOKEN }}@github.com/robycigar/million-candles.git
            git pull origin main

            # 3. Solusi EACCES (Next.js): Hapus folder build dan cache .next lama
            # Ini memastikan folder .next dibuat ulang dengan izin yang benar saat build
            rm -rf .next 

            # --- Next.js Deployment (Frontend) ---
            # Load NVM/pnpm environment
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            pnpm --help

            # Install Next.js dependencies
            pnpm install

            # Build the Next.js application for production
            pnpm run build

            # Restart the Next.js application with PM2
            pm2 restart million-candles-fe-prod

            # --- Laravel Backend Deployment ---
            # Move to backend directory
            cd backend

            # Set environment variables for Composer
            export COMPOSER_ALLOW_SUPERUSER=1
            export COMPOSER_NO_INTERACTION=1

            # Install dependencies
            composer install --no-dev --optimize-autoloader --no-interaction

            # Cache Laravel configs
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Run migrations
            php artisan migrate --force
