name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # --- Next.js Build & Sync ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" # Ganti dengan versi Node.js Anda

      - name: Install and Build Next.js
        run: |
          npm install
          npm run build

      - name: Sync Next.js files to server
        uses: appleboy/rsync-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: ".next, .next/cache, public" # Hanya kirim folder hasil build & public
          target: "/var/www/html/million-candles"
          overwrite: true

      # --- Laravel Backend Deployment ---
      - name: Sync Laravel files to server
        uses: appleboy/rsync-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "backend"
          target: "/var/www/html/million-candles"
          overwrite: true

      # --- Run post-deployment scripts on server ---
      - name: Post-deployment scripts
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/html/million-candles

            # Restart Next.js app with PM2
            pm2 restart 0

            # Change to backend directory
            cd backend

            # Set environment variables for Composer
            export COMPOSER_ALLOW_SUPERUSER=1
            export COMPOSER_NO_INTERACTION=1

            # Install dependencies
            composer install --no-dev --optimize-autoloader --no-interaction

            # Cache Laravel configs
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Run migrations
            php artisan migrate --force
