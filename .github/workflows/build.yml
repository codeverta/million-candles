name: Build

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check for errors
        run: |
          if [ $? -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi
